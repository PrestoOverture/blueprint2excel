[project]
name = "drawing-inspector"
version = "0.1.0"
description = "Vector PDF inspection primitives for engineering drawings"
requires-python = ">=3.11"
dependencies = [
    "openpyxl",
    "pdfplumber",
    "pymupdf",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

